# The lock screen Bioma falls back to when its own could not lock or died while
# locked: `scripts/lock` runs hyprlock with this file. Plain on purpose — it
# only has to be a way back in.

general {
    hide_cursor = false
}

background {
    monitor =
    color = rgba(16, 20, 14, 1.0)
}

label {
    monitor =
    text = Bioma's lock screen stopped. Type your password to unlock.
    color = rgba(220, 226, 210, 0.9)
    font_size = 16
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 1
    dots_center = true
    outer_color = rgba(185, 222, 107, 0.6)
    inner_color = rgba(16, 20, 14, 1.0)
    font_color = rgba(220, 226, 210, 1.0)
    fade_on_empty = false
    placeholder_text = Password
    fail_color = rgba(230, 110, 100, 1.0)
    position = 0, 0
    halign = center
    valign = center
}
